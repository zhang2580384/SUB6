name: SUB6 validation
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sub6-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    env:
      GOMEMLIMIT: 2GiB
      GOGC: "50"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global --ignore-scripts pnpm@9.15.9
      - run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir frontend run lint:check
      - run: pnpm --dir frontend run build
      - run: pnpm --dir frontend exec vitest run --maxWorkers=2 --minWorkers=1
      - name: Managed rolling updater safety tests
        run: python3 -m unittest discover -s deploy/managed-updater -p test_controller.py -v
      - name: Install real Redis for cross-node history regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          redis-server --version
      - name: Verify Go modules
        working-directory: backend
        run: go mod verify
      - name: Backend unit tests
        working-directory: backend
        run: go test -p 2 -tags unit ./... -count=1 -timeout=20m
      - name: Official Kimi, GLM and Gemini billing regressions
        working-directory: backend
        run: go test -p 2 -race -tags unit ./internal/service -run '^Test(KimiGLM|GeminiCarbon|ExtractGeminiUsage)' -count=1 -timeout=5m
      - name: WebSocket logical-session race regressions
        working-directory: backend
        run: >-
          go test -p 2 -race -tags unit ./internal/handler ./internal/service ./internal/requestcapture
          -run 'Test(OpenAIWSStream|OpenAIWSLogical|OpenAIWSConnPool_Close|APIKeyAdmissionFork|Issue600(ClientIdentityNetwork|InitialIdentityPolicy|DisabledSessionBlockKeepsIdentityPolicy|NestedIdentityNetwork)|OpenAIResponsesWebSocket_.*FirstMessage|WebSocketFork)'
          -count=1 -timeout=5m
      - name: Committed ownership, readable recovery and moderation race regressions
        working-directory: backend
        run: >-
          go test -p 2 -race -tags unit ./internal/handler ./internal/service ./internal/repository
          -run '^Test(Issue805|OpenAI409|OpenAIAgentHTTPBridge|OpenAIHTTPAndWSBridge|OpenAIWSForwardRecovery|OpenAIWSHTTPBridgeHistory|ModerationUpstream|TempUnsched|OpenAIWSReadable)'
          -count=1 -v -timeout=10m
      - name: Embedded payment engine tests
        working-directory: backend
        run: go test github.com/v03413/bepusdt/app/conf github.com/v03413/bepusdt/app/task github.com/v03413/bepusdt/app/task/notify -count=1 -timeout=5m
      - name: Build embedded release distribution
        working-directory: backend
        env:
          SUB6_BUILD_COMMIT: ${{ github.sha }}
        run: |
          make build-release RELEASE_OUTPUT="$RUNNER_TEMP/sub6" RELEASE_COMMIT="$SUB6_BUILD_COMMIT"
          "$RUNNER_TEMP/sub6" -version
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and smoke-test exact clean distribution and image
        run: python3 maintenance/package-distribution.py --output "$RUNNER_TEMP/sub6-distribution"
      - name: Retain reviewed candidate assets; never publish or deploy automatically
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sub6-distribution-${{ github.sha }}
          path: ${{ runner.temp }}/sub6-distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  quota-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOMEMLIMIT: 2GiB
      GOGC: "50"
      SUB2API_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 dbname=sub6_test user=sub6_test password=sub6-test-only sslmode=disable TimeZone=UTC'
      SUB2API_TEST_REDIS_URL: 'redis://127.0.0.1:6379/0'
      CI: 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sub6_test
          POSTGRES_DB: sub6_test
          POSTGRES_PASSWORD: sub6-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sub6_test -d sub6_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.4'
          cache-dependency-path: backend/go.sum
      - name: Preserve pending 5xx and retained lease/ownership contracts
        working-directory: backend
        run: >-
          go test -p 2 -race -tags integration ./internal/repository
          -run '^(TestSUB6MigrationKeepsUnknownHistoryAndRepeatedPrefixes|TestIssue817QuotaSkipPreservesPending5xxExecution|TestIssue817QuotaSkipPreserves401AndOwnership|TestIssue817QuotaSkipRetainsActualIsolationOwnership|TestIssue817ManualTriggerIsOneShotAndLeaseFenced|TestQuality5xxClaimKeepsCronAndCoalescesScheduledRun|TestQuality5xxFinishConsumesCrossedCronWithoutOverwritingEdits|TestQualityRetestRestBlocksEveryClaimUntilDeadline)$'
          -count=1 -v -timeout=10m
      - name: Upstream HTTP2, weekly quota and historical platform regressions
        working-directory: backend
        run: >-
          go test -p 2 -race -tags integration ./internal/repository
          -run '^(TestUsagePlatform|TestUsageReasoningEffort|TestSUB6V016Upgrade|TestHTTP2|TestOAuth429|TestUsageBillingRepositoryApply_SettlesSoftDeletedAPIKey)'
          -count=1 -v -timeout=10m
      - name: Manual worker fencing, selected moderation and real Redis reset
        working-directory: backend
        run: >-
          go test -p 2 -race -tags integration ./internal/repository
          -run '^Test(Issue817Manual(Worker|Update|Generation)|ModerationUpstream|TempUnschedRealRedis)'
          -count=1 -v -timeout=10m
      - name: Create disposable prompt audit database
        env:
          PGPASSWORD: sub6-test-only
        run: psql -h 127.0.0.1 -U sub6_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE sub6_audit;'
      - name: Recovered context privacy and asynchronous penalty transaction
        working-directory: backend
        env:
          PROMPT_AUDIT_TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 dbname=sub6_audit user=sub6_test password=sub6-test-only sslmode=disable'
          PROMPT_AUDIT_TEST_REDIS_ADDR: '127.0.0.1:6379'
        run: >-
          go test -p 2 -race -tags integration ./internal/securityaudit
          -run '^Test(RecoveredContext|SecurityPenaltyAsyncFinding|SecurityPenaltyConcurrent)'
          -count=1 -v -timeout=10m
      - name: Migration-only CLI and repeat against disposable database
        working-directory: backend
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '5432'
          DATABASE_USER: sub6_test
          DATABASE_PASSWORD: sub6-test-only
          DATABASE_DBNAME: sub6_test
          DATABASE_SSLMODE: disable
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sub6-migrations" ./cmd/server
          "$RUNNER_TEMP/sub6-migrations" --migrate-only --migration-timeout=5m
          "$RUNNER_TEMP/sub6-migrations" --migrate-only --migration-timeout=5m
      - name: Read exact stable 0.1.5 source for rollback verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b3f8199dc3cc1e1520214fdd77832fc01b36578e
          path: stable-rollback-source
          persist-credentials: false
      - name: Actual stable binary migration reader and billing on upgraded schema
        working-directory: stable-rollback-source/backend
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '5432'
          DATABASE_USER: sub6_test
          DATABASE_PASSWORD: sub6-test-only
          DATABASE_DBNAME: sub6_test
          DATABASE_SSLMODE: disable
        run: |
          test "$(git rev-parse HEAD)" = b3f8199dc3cc1e1520214fdd77832fc01b36578e
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/sub6-stable-migrations" ./cmd/server
          "$RUNNER_TEMP/sub6-stable-migrations" --migrate-only --migration-timeout=5m
          go test -p 2 -race -tags integration ./internal/repository \
            -run '^(TestUsageLogRepoSuite|TestUsageBillingRepositoryApply_(DeduplicatesBalanceBilling|DeduplicatesSubscriptionBilling|RequestFingerprintConflict|SettlesSoftDeletedAPIKey))$' \
            -count=1 -v -timeout=10m
      - name: Real online controller migration, lock timeout and retry
        env:
          SUB6_ONLINE_UPGRADE_FIXTURE: '1'
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '5432'
          DATABASE_USER: sub6_test
          DATABASE_PASSWORD: sub6-test-only
          DATABASE_SSLMODE: disable
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,SUB6_ONLINE_UPGRADE_FIXTURE,DATABASE_HOST,DATABASE_PORT,DATABASE_USER,DATABASE_PASSWORD,DATABASE_SSLMODE
          python3 deploy/managed-updater/test_online_migration.py
          "$RUNNER_TEMP/sub6-migrations" "$RUNNER_TEMP/sub6-stable-migrations"
  sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sub6_review
          POSTGRES_DB: sub6_review
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sub6_review -d sub6_review"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m venv /tmp/sub6-review
      - run: '/tmp/sub6-review/bin/pip install --only-binary=:all: -r deploy/direct-access/requirements.lock'
      - working-directory: deploy/direct-access
        env:
          SUB6_REVIEW_DATABASE_URL: postgresql://sub6_review@127.0.0.1:5432/sub6_review
        run: /tmp/sub6-review/bin/python -m unittest test_policy test_configuration test_access -v
